<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>MS-DOS 6 — Built from Source</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
            color: #fff;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 1.5rem;
        }
        .subtitle a { color: #6ea8d9; text-decoration: none; }
        .subtitle a:hover { text-decoration: underline; }
        #screen_container {
            background: #000;
            border: 2px solid #333;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }
        #screen_container > div {
            white-space: pre;
            font: 14px monospace;
            line-height: 14px;
        }
        #screen_container > canvas { display: none; }
        #status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #888;
        }
        #status.error { color: #e74c3c; }
        .info {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
            max-width: 640px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>MS-DOS 6.0</h1>
    <p class="subtitle">
        Built from source &mdash;
        <a href="https://github.com/tgies/astro">github.com/tgies/astro</a>
    </p>

    <div id="screen_container">
        <div></div>
        <canvas></canvas>
    </div>

    <div id="status">Loading...</div>

    <div class="info">
        Click the screen to capture keyboard input. Press Escape to release.<br>
        Powered by <a href="https://github.com/copy/v86" style="color: #6ea8d9;">v86</a>.
        Boot image from the latest
        <a href="https://github.com/tgies/astro/releases" style="color: #6ea8d9;">release</a>.
    </div>

    <script src="libv86.js"></script>
    <script>
    "use strict";

    const statusEl = document.getElementById("status");

    function setStatus(msg, isError) {
        statusEl.textContent = msg;
        statusEl.className = isError ? "error" : "";
    }

    async function fetchBinary(url) {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`Failed to fetch ${url}: ${resp.status}`);
        return resp.arrayBuffer();
    }

    async function boot() {
        try {
            setStatus("Downloading BIOS and disk image...");

            const [bios, vgaBios, floppy] = await Promise.all([
                fetchBinary("seabios.bin"),
                fetchBinary("vgabios.bin"),
                fetchBinary("dos6retail-boot.img"),
            ]);

            setStatus("Booting MS-DOS 6...");

            const emulator = new V86({
                wasm_path: "v86.wasm",
                memory_size: 16 * 1024 * 1024,
                vga_memory_size: 2 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { buffer: bios },
                vga_bios: { buffer: vgaBios },
                fda: { buffer: floppy },
                autostart: true,
            });

            emulator.add_listener("emulator-ready", function() {
                setStatus("Running. Click screen to type.");
            });

        } catch (err) {
            setStatus("Error: " + err.message, true);
            console.error(err);
        }
    }

    boot();
    </script>
</body>
</html>
