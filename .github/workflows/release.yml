name: Release MS-DOS 6

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (default: short commit SHA)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dosemu2 and mtools
        run: |
          sudo add-apt-repository -y ppa:dosemu2/ppa
          sudo apt-get update
          sudo apt-get install -y dosemu2 mtools

      - name: Download bootstrap files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .bootstrap-release ]; then
            tag="$(cat .bootstrap-release)"
            echo "Downloading bootstrap files from release $tag..."
            mkdir -p bootstrap
            gh release download "$tag" \
              --pattern "io.sys" --pattern "msdos.sys" --pattern "command.com" \
              --dir bootstrap/
            # mak.sh expects uppercase filenames
            cd bootstrap
            mv io.sys IO.SYS
            mv msdos.sys MSDOS.SYS
            mv command.com COMMAND.COM
            cd ..
            echo "Bootstrap files downloaded."
          elif [ -f bootstrap/IO.SYS ]; then
            echo "Using checked-in bootstrap files."
          else
            echo "ERROR: No .bootstrap-release file and no bootstrap/ directory."
            exit 1
          fi

      - name: Build DOS 6
        run: timeout 3600 ./mak.sh

      - name: Create retail hard disk image
        run: timeout 300 ./mkhdimg.sh --retail

      - name: Create OEM hard disk image
        run: timeout 300 ./mkhdimg.sh --oem

      - name: Create retail boot floppy
        run: timeout 300 ./mkhdimg.sh --floppy --retail

      - name: Create OEM boot floppy
        run: timeout 300 ./mkhdimg.sh --floppy --oem

      - name: Package artifacts
        run: |
          cd binaries && zip -r ../dos6-binaries.zip . && cd ..
          cd compress && zip -r ../dos6-compressed.zip . && cd ..
          # Copy bootstrap files with lowercase names for release assets
          cp binaries/io.sys io.sys
          cp binaries/msdos.sys msdos.sys
          cp binaries/command.com command.com
          cp binaries/sys.com sys.com

      - name: Set release version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "MS-DOS 6 ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            dos6-binaries.zip \
            dos6-compressed.zip \
            dos6retail.raw.img \
            dos6oem.raw.img \
            dos6retail-boot.img \
            dos6oem-boot.img \
            io.sys \
            msdos.sys \
            command.com \
            sys.com
