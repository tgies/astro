name: Deploy GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dosemu2 and mtools
        run: |
          sudo add-apt-repository -y ppa:dosemu2/ppa
          sudo apt-get update
          sudo apt-get install -y dosemu2 mtools

      - name: Download bootstrap files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .bootstrap-release ]; then
            tag="$(cat .bootstrap-release)"
            echo "Downloading bootstrap files from release $tag..."
            mkdir -p bootstrap
            gh release download "$tag" \
              --pattern "io.sys" --pattern "msdos.sys" --pattern "command.com" \
              --dir bootstrap/
            cd bootstrap
            mv io.sys IO.SYS
            mv msdos.sys MSDOS.SYS
            mv command.com COMMAND.COM
            cd ..
          fi

      - name: Download v86 assets
        run: |
          mkdir -p _site
          V86_TAG="latest"
          V86_API="https://api.github.com/repos/copy/v86/releases/tags/${V86_TAG}"
          RELEASE_JSON=$(curl -sf "$V86_API")
          echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libv86.js") | .browser_download_url' | xargs curl -sfL -o _site/libv86.js
          echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "v86.wasm") | .browser_download_url' | xargs curl -sfL -o _site/v86.wasm

      - name: Download BIOS files
        run: |
          curl -sfL -o _site/seabios.bin "https://raw.githubusercontent.com/copy/v86/master/bios/seabios.bin"
          curl -sfL -o _site/vgabios.bin "https://raw.githubusercontent.com/copy/v86/master/bios/vgabios.bin"

      - name: Download boot floppy from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern "dos6retail-boot.img" --dir _site/

      - name: Build source tree disk image
        run: |
          timeout 300 ./mkbuildimg.sh -o _site/dos6-build.img

      - name: Copy site files and inject image size
        run: |
          IMG_SIZE=$(stat -c%s _site/dos6-build.img)
          sed "s/DOS6_BUILD_IMG_SIZE/${IMG_SIZE}/" docs/index.html > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
